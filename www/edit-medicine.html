<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediMind - Medicine Reminder Application</title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#4f46e5">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="nav-brand">
      <i class="ri-heart-pulse-fill"></i>
      <span>MediMind</span>
    </a>
    
    <ul class="nav-links">
      <li>
        <a href="index.html" class="nav-link">
          <i class="ri-dashboard-line"></i> Dashboard
        </a>
      </li>
      <li>
        <a href="medicines.html" class="nav-link active">
          <i class="ri-capsule-line"></i> Medicines
        </a>
      </li>
      <li>
        <a href="history.html" class="nav-link">
          <i class="ri-history-line"></i> History
        </a>
      </li>
    </ul>

    <div class="nav-actions">
      <button class="theme-toggle-btn" id="themeToggleBtn" aria-label="Toggle dark mode">
        <i class="ri-moon-line moon-icon"></i>
        <i class="ri-sun-line sun-icon"></i>
      </button>
    </div>
  </nav>

  <main class="container">
    <div style="max-width: 600px; margin: 0 auto;">
      <div class="glass-panel">
        <div style="margin-bottom: 25px;">
          <h2><i class="ri-edit-circle-line"></i> Edit Medicine</h2>
          <p style="color: var(--text-secondary); margin-top: 4px;">Update the medicine schedule details below.</p>
        </div>

        <div class="alert alert-danger" id="errorAlert" style="display: none;">
          <i class="ri-error-warning-line"></i>
          <span id="errorMessage">Error text</span>
        </div>

        <form id="editMedicineForm">
          <div class="form-group">
            <label for="medicineName" class="form-label">Medicine Name</label>
            <input 
              type="text" 
              id="medicineName" 
              class="form-control" 
              placeholder="e.g. Paracetamol, Metformin" 
              required 
              autocomplete="off"
            >
          </div>

          <div class="form-group">
            <label for="dosage" class="form-label">Dosage</label>
            <input 
              type="text" 
              id="dosage" 
              class="form-control" 
              placeholder="e.g. 1 Tablet, 5ml, 2 Capsules" 
              required 
              autocomplete="off"
            >
          </div>

          <div class="form-group">
            <label for="time" class="form-label">Reminder Time</label>
            <input 
              type="time" 
              id="time" 
              class="form-control" 
              required
            >
          </div>

          <div class="form-group" style="margin-bottom: 25px;">
            <label class="form-label">Schedule Days (Select at least one)</label>
            <div style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px;" id="daysContainer">
              <!-- Days checkboxes dynamically loaded -->
            </div>
          </div>

          <div class="form-group" style="margin-bottom: 25px;">
            <label for="ringtone" class="form-label">Ringtone Alert Style</label>
            <select id="ringtone" class="form-control" style="cursor: pointer;">
              <option value="Chime">Chime (Medical Chord)</option>
              <option value="Digital">Digital (Beep Alarm)</option>
              <option value="Pulse">Pulse (Soft Pulse Hum)</option>
            </select>
          </div>

          <div class="form-group" style="margin-bottom: 30px;">
            <label for="notes" class="form-label">Special Notes / Instructions (Optional)</label>
            <textarea 
              id="notes" 
              class="form-control" 
              placeholder="e.g. Take with food, Avoid milk, Take before sleeping..."
            ></textarea>
          </div>

          <div style="display: flex; gap: 15px; justify-content: flex-end;">
            <a href="medicines.html" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">
              <i class="ri-check-line"></i> Save Changes
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; <span id="yearSpan"></span> MediMind. All rights reserved. Designed for College Mini Project.</p>
  </footer>

  <!-- Global Glassmorphic Alarm Notification Overlay -->
  <div class="alarm-overlay" id="alarmOverlay">
    <div class="alarm-modal">
      <div class="alarm-icon-wrapper">
        <i class="ri-notification-3-line"></i>
      </div>
      <h2 class="alarm-title">Medication Due Now!</h2>
      <div class="alarm-med-name" id="alarmMedName">Medicine Name</div>
      <div class="alarm-med-dosage" id="alarmMedDosage">1 Tablet</div>
      <div class="alarm-actions">
        <button class="btn btn-success" id="alarmBtnTaken">
          <i class="ri-check-line"></i> Mark as Taken
        </button>
        <button class="btn btn-danger" id="alarmBtnMissed">
          <i class="ri-close-line"></i> Mark as Missed
        </button>
      </div>
    </div>
  </div>
  
  <script src="js/db.js"></script>
  <script src="js/reminder-service.js"></script>
  <script>
    // Theme Toggle Handler
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    themeToggleBtn.addEventListener('click', () => {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
    });

    document.getElementById('yearSpan').textContent = new Date().getFullYear();

    // Get Medicine ID from URL query param
    const urlParams = new URLSearchParams(window.location.search);
    const medicineId = parseInt(urlParams.get('id'), 10);

    if (isNaN(medicineId)) {
      window.location.href = 'medicines.html';
    }

    // Load medicine details
    let currentMedicine = null;
    if (window.DB) {
      currentMedicine = window.DB.getMedicineById(medicineId);
    }

    if (!currentMedicine) {
      window.location.href = 'medicines.html';
    }

    // Fill form fields
    document.getElementById('medicineName').value = currentMedicine.MedicineName;
    document.getElementById('dosage').value = currentMedicine.Dosage;
    document.getElementById('time').value = currentMedicine.Time;
    document.getElementById('ringtone').value = currentMedicine.Ringtone;
    document.getElementById('notes').value = currentMedicine.Notes || '';

    // Render schedule days checkboxes
    const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
    const daysContainer = document.getElementById('daysContainer');
    const scheduledDays = currentMedicine.DaysOfWeek ? currentMedicine.DaysOfWeek.split(',') : [];

    days.forEach(day => {
      const label = document.createElement('label');
      label.className = 'day-checkbox-label';
      label.style.cssText = 'display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border: 1px solid var(--border-glass); border-radius: var(--radius-sm); cursor: pointer; background: var(--bg-secondary); transition: all var(--transition-fast); font-weight: 500; font-size: 0.9rem; color: var(--text-primary);';

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.name = 'daysOfWeek';
      checkbox.value = day;
      checkbox.style.cssText = 'width: 16px; height: 16px; accent-color: var(--color-primary);';
      
      if (scheduledDays.includes(day)) {
        checkbox.checked = true;
        label.style.borderColor = 'var(--color-primary)';
        label.style.background = 'var(--color-primary-light)';
      }

      checkbox.addEventListener('change', () => {
        if (checkbox.checked) {
          label.style.borderColor = 'var(--color-primary)';
          label.style.background = 'var(--color-primary-light)';
        } else {
          label.style.borderColor = 'var(--border-glass)';
          label.style.background = 'var(--bg-secondary)';
        }
      });

      label.appendChild(checkbox);
      label.appendChild(document.createTextNode(day.substring(0, 3)));
      daysContainer.appendChild(label);
    });

    // Ringtone preview
    document.getElementById('ringtone').addEventListener('change', function() {
      const val = this.value;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      const ctx = new AudioContext();
      
      if (val === 'Chime') {
        const playTone = (freq, start, duration) => {
          const osc = ctx.createOscillator();
          const gainNode = ctx.createGain();
          osc.connect(gainNode);
          gainNode.connect(ctx.destination);
          osc.frequency.setValueAtTime(freq, ctx.currentTime + start);
          osc.type = 'sine';
          gainNode.gain.setValueAtTime(0.04, ctx.currentTime + start);
          gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + duration);
          osc.start(ctx.currentTime + start);
          osc.stop(ctx.currentTime + start + duration);
        };
        playTone(523.25, 0, 0.3);
        playTone(659.25, 0.15, 0.3);
        playTone(783.99, 0.3, 0.4);
      } else if (val === 'Digital') {
        const playBeep = (start) => {
          const osc = ctx.createOscillator();
          const gainNode = ctx.createGain();
          osc.connect(gainNode);
          gainNode.connect(ctx.destination);
          osc.frequency.setValueAtTime(880, ctx.currentTime + start);
          osc.type = 'square';
          gainNode.gain.setValueAtTime(0, ctx.currentTime + start);
          gainNode.gain.linearRampToValueAtTime(0.02, ctx.currentTime + start + 0.02);
          gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + 0.12);
          osc.start(ctx.currentTime + start);
          osc.stop(ctx.currentTime + start + 0.12);
        };
        playBeep(0);
        playBeep(0.18);
      } else if (val === 'Pulse') {
        const osc = ctx.createOscillator();
        const gainNode = ctx.createGain();
        osc.connect(gainNode);
        gainNode.connect(ctx.destination);
        osc.frequency.setValueAtTime(220, ctx.currentTime);
        osc.type = 'triangle';
        gainNode.gain.setValueAtTime(0.05, ctx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
        osc.start();
        osc.stop(ctx.currentTime + 0.5);
      }
      
      setTimeout(() => {
        ctx.close();
      }, 1000);
    });

    // Form submission
    document.getElementById('editMedicineForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const medicineName = document.getElementById('medicineName').value;
      const dosage = document.getElementById('dosage').value;
      const time = document.getElementById('time').value;
      const ringtone = document.getElementById('ringtone').value;
      const notes = document.getElementById('notes').value;

      const checkedBoxes = document.querySelectorAll('input[name="daysOfWeek"]:checked');
      const checkedDays = Array.from(checkedBoxes).map(cb => cb.value);

      const errorAlert = document.getElementById('errorAlert');
      const errorMessage = document.getElementById('errorMessage');

      if (checkedDays.length === 0) {
        errorAlert.style.display = 'flex';
        errorMessage.textContent = 'Please select at least one scheduled day.';
        return;
      }

      if (!window.DB) return;

      try {
        window.DB.updateMedicine(medicineId, {
          medicineName,
          dosage,
          time,
          daysOfWeek: checkedDays.join(','),
          ringtone,
          notes
        });
        window.location.href = 'medicines.html';
      } catch (err) {
        console.error('Error updating medicine:', err);
        errorAlert.style.display = 'flex';
        errorMessage.textContent = 'An error occurred while updating the medicine.';
      }
    });
  </script>
</body>
</html>
